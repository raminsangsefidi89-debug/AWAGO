[project]
name = "awago"
version = "2.0.0"
description = "AWAGO — FX analysis and probabilistic forecasting platform (local-first, Persian RTL dashboard)"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "data", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI Depends in defaults
    "SIM108", # ternary not always clearer
    "RUF001", # ambiguous unicode (Persian strings are intentional)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"scripts/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "tests"]

[tool.mypy]
python_version = "3.10"
files = ["app"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
# Pragmatic strictness: full strict mode is deferred (see ADR-0001).

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/static/*", "app/templates/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
